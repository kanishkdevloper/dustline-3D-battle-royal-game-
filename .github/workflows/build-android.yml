name: Build Dustline (APK + AAB)

# Run it by hand: GitHub > Actions > "Build Dustline (APK + AAB)" > Run workflow.
# It also runs on every push to main / master.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android SDK command-line tools and accepts the licences;
      # the Android Gradle Plugin then downloads platform 36 / build-tools by itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Gradle 8.13 is downloaded and put on PATH (the project has no gradlew script).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Privacy policy must match the app (fails if the app changed and the policy was not rebuilt)
        run: python3 tools/make_privacy_policy.py --check

      - name: Restore the upload keystore (only when the secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dustline-upload.jks"
            echo "DUSTLINE_KEYSTORE_FILE=$RUNNER_TEMP/dustline-upload.jks" >> "$GITHUB_ENV"
            echo "Keystore restored - the release build will be signed."
          else
            echo "::warning::Secret KEYSTORE_BASE64 is not set - the release APK/AAB will be UNSIGNED (the debug APK is still built)."
          fi

      - name: Build debug APK, release APK and release AAB
        env:
          DUSTLINE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DUSTLINE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DUSTLINE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Collect the files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ || true
          cp app/build/outputs/apk/release/*.apk dist/ || true
          cp app/build/outputs/bundle/release/*.aab dist/ || true
          ls -la dist
          {
            echo "### Which file to install?"
            echo "- **app-debug.apk** = installs on any phone (signed with the debug key). Use this to test."
            echo "- **app-release-unsigned.apk** (no keystore secrets) cannot be installed - Android refuses unsigned APKs."
            echo "- **app-release.aab** = only for Play Console, and only when the 4 keystore secrets are set."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dustline-build
          path: dist/*
          if-no-files-found: error

      # Last step on purpose (after the upload): the job turns RED if the AAB is not signed, so you notice before Play Console rejects it.
      - name: Check that the release AAB is signed
        run: |
          out="$(jarsigner -verify app/build/outputs/bundle/release/app-release.aab 2>&1 || true)"
          echo "$out" | head -5
          echo "$out" | grep -q "jar verified" || { echo "::error::app-release.aab is NOT signed - add the 4 secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) and run again. Play Console rejects unsigned bundles."; exit 1; }
